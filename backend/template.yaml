AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Harry's Risers backend - API + scheduled collector (Lambda, API Gateway, DynamoDB)

Parameters:
  CorsOrigins:
    Type: String
    Default: "https://cmathews33.github.io,http://localhost:4200"
    Description: Comma-separated allowed origins (set to the GitHub Pages URL in prod)
  RedditSource:
    Type: String
    Default: rss
    AllowedValues: [rss, praw]
    Description: Reddit data source (rss ships now; praw when registration clears)

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref DataTable
        CORS_ORIGINS: !Ref CorsOrigins
        REDDIT_SOURCE: !Ref RedditSource

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Throttled HTTP API — rate limit is per-account per-stage across all routes.
  # BurstLimit: max concurrent requests at any instant.
  # ThrottlingRateLimit: sustained requests per second.
  # These are deliberately conservative for a personal project.
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.api_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref AppHttpApi
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref AppHttpApi

  CollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.collector_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      # The collector runs as distinct daily phases; each schedule passes a
      # `mode` in its Input. Times are America/New_York (handles DST).
      Events:
        # Tally distinct Reddit posts per ticker through the day (hourly, all week).
        Accumulate:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 0/1 ? * * *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"mode": "accumulate"}'
        # Freeze the prior 24h window (8am yesterday → 8am today) as the displayed list.
        Select:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 ? * * *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"mode": "select"}'
        # Capture each ticker's start-of-day price at market open.
        Open:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 9 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"mode": "open"}'
        # Refresh live prices for the frozen list through the trading day.
        Price:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/15 10-15 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"mode": "price"}'
        # Capture end-of-day price and write the daily trend record at the close.
        Close:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 16 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Input: '{"mode": "close"}'

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API (set as apiBaseUrl in the frontend)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref DataTable
