AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Harry's Risers backend - API + scheduled collector (Lambda, API Gateway, DynamoDB)

Parameters:
  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated allowed origins (set to the GitHub Pages URL in prod)
  RedditSource:
    Type: String
    Default: rss
    AllowedValues: [rss, praw]
    Description: Reddit data source (rss ships now; praw when registration clears)

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref DataTable
        CORS_ORIGINS: !Ref CorsOrigins
        REDDIT_SOURCE: !Ref RedditSource

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.api_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  CollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.collector_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(30 minutes)

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API (set as apiBaseUrl in the frontend)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref DataTable
