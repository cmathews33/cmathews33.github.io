AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Harry's Risers backend - API + scheduled collector (Lambda, API Gateway, DynamoDB)

Parameters:
  CorsOrigins:
    Type: String
    Default: "https://cmathews33.github.io,http://localhost:4200"
    Description: Comma-separated allowed origins (set to the GitHub Pages URL in prod)
  RedditSource:
    Type: String
    Default: rss
    AllowedValues: [rss, praw]
    Description: Reddit data source (rss ships now; praw when registration clears)

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref DataTable
        CORS_ORIGINS: !Ref CorsOrigins
        REDDIT_SOURCE: !Ref RedditSource

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Throttled HTTP API — rate limit is per-account per-stage across all routes.
  # BurstLimit: max concurrent requests at any instant.
  # ThrottlingRateLimit: sustained requests per second.
  # These are deliberately conservative for a personal project.
  AppHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.api_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref AppHttpApi
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref AppHttpApi

  CollectorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: harrys-risers
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.handlers.collector_handler"]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        # Fresh data when it matters: every 15 min during US market hours on
        # weekdays. Times are interpreted in America/New_York (handles DST).
        MarketHours:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/15 9-16 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
        # Low-cadence heartbeat the rest of the time (off-hours + weekends) so
        # the snapshot never goes badly stale. Hourly, all week.
        OffHours:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 * ? * * *)
            ScheduleExpressionTimezone: America/New_York

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API (set as apiBaseUrl in the frontend)
    Value: !Sub "https://${AppHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref DataTable
